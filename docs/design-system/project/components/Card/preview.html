<!-- @dsCard group="Superficies" height=230 subtitle="Tarjeta con encabezado y filas" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  .stage { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 20px; }
  .col { display: grid; gap: 12px; padding: 20px; }
  .note { font-size: 12px; color: var(--ink-faint); }

</style>
</head>
<body>
<div style="padding:20px">
  <section class="card" style="overflow:hidden;max-width:520px">
    <header style="display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 12px">
      <span style="display:flex;align-items:baseline;gap:12px"><span class="card-title">Próximas tareas</span><span class="hand" style="font-size:14px">lo que no puede esperar</span></span>
      <span class="count">3</span>
    </header>
    <div style="border-top:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(210,207,200,.6)">
        <span style="width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(30,29,27,.3)"></span>
        <span style="flex:1">Maquetación de la home</span><span class="badge badge-ocean">En curso</span><span style="color:var(--coral);font-size:12px;font-weight:500">Hace 2 días</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:12px 20px">
        <span style="width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(30,29,27,.3)"></span>
        <span style="flex:1">Storyboard escenas 3–6</span><span class="badge badge-honey">En revisión</span><span style="color:var(--honey);font-size:12px;font-weight:500">Hoy</span>
      </div>
    </div>
  </section>
</div>
</body>
</html>
