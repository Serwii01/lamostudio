<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  .stage { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 20px; }
  .col { display: grid; gap: 12px; padding: 20px; }
  .note { font-size: 12px; color: var(--ink-faint); }

</style>
</head>
<body>
<div class="col">
  <div class="stage" style="padding:0">
    <button class="btn btn-primary">+ Nueva tarea</button>
    <button class="btn btn-accent">Crear un proyecto</button>
    <button class="btn btn-outline">Nota</button>
    <button class="btn btn-ghost">Cancelar</button>
    <button class="btn btn-danger">Eliminar</button>
  </div>
  <div class="stage" style="padding:0">
    <button class="btn btn-outline btn-sm">Adjuntar archivo</button>
    <button class="btn btn-primary btn-sm">Comentar</button>
    <button class="btn btn-primary" disabled>Crear tarea</button>
  </div>
</div>
</body>
</html>
